<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grupo 6 | Joyn</title><style>body{font-family:system-ui;background:#061f24;color:white;display:grid;place-items:center;height:100vh;margin:0}b{color:#b8f23d}</style></head><body><p>Carregando <b>Joyn Discovery Lab</b>…</p><script>fetch('joyn_grupo6_v3.html').then(r=>r.text()).then(src=>{const d=new DOMParser().parseFromString(src,'text/html');const nav=d.querySelector('nav');if(nav)nav.insertAdjacentHTML('beforeend','<a href="#monetizacao">Monetização</a>');const strategy=d.querySelector('#estrategia');const pricing=`<section id="monetizacao" style="background:#eaf2f0"><div class="w"><div class="ey" style="color:#087e72">04 • Pricing discovery</div><h2>Quando pertencimento vira valor?</h2><p class="muted">A próxima hipótese não é apenas quanto cobrar. É descobrir <b>quem deve pagar, pelo quê e em qual momento da jornada</b>. Os modelos abaixo são hipóteses para discussão e validação com usuários, organizadores e parceiros — não decisões finais de preço.</p><div class="grid g4" style="margin-top:28px"><div class="card source reveal"><div class="ico">◎</div><h3>Praticante • Freemium</h3><p><b>Free:</b> perfil, atividades, grupos e entrada em partidas/eventos.</p><p><b>Joyn+ • R$ 14,90–29,90/mês:</b> compatibilidade avançada, prioridade em vagas, grupos privados, histórico, estatísticas, benefícios e destaque.</p><div class="context">Hipótese: o gratuito cria densidade; o premium monetiza conveniência, confiança e recorrência.</div></div><div class="card source reveal"><div class="ico">↻</div><h3>Organizadores</h3><p>Eventos, vagas, pagamentos, recorrência, lista de espera, substituição de desistentes e comunicação em um único fluxo.</p><p><b>Hipótese de captura:</b> 5% a 10% sobre inscrições/pagamentos.</p><div class="context">Valor percebido: menos operação manual e menos partidas perdidas por desistência.</div></div><div class="card source reveal"><div class="ico">⌖</div><h3>Espaços esportivos • B2B</h3><p>Quadras, clubes, academias e arenas podem divulgar horários, preencher ociosidade, criar eventos e captar novos clientes.</p><p><b>Modelo:</b> mensalidade B2B + comissão por reserva.</p><div class="context">Hipótese: conectar demanda esportiva existente com capacidade ociosa.</div></div><div class="card source reveal"><div class="ico">◒</div><h3>Marketplace</h3><p>Equipamentos, roupas, aulas, personal trainers, fisioterapia, eventos e experiências esportivas.</p><p><b>Modelo:</b> comissão sobre transações.</p><div class="context">Expansão futura: monetizar depois que existir comunidade e intenção esportiva recorrente.</div></div></div><div class="note" style="margin-top:24px"><b>Leitura PM:</b> não precisamos provar que todos pagarão uma assinatura. Precisamos descobrir onde a Joyn cria valor econômico real ao longo da jornada: <b>descobrir → conectar → organizar → reservar → praticar → voltar → evoluir.</b></div><div style="margin-top:56px"><div class="ey" style="color:#087e72">Acceptance lens</div><h2 style="font-size:34px">Como testar aceitação sem perguntar apenas “você pagaria?”</h2><div class="grid g3"><div class="card reveal"><h3>01 • Gatilho de pagamento</h3><p>Em qual momento a Joyn criou valor suficiente para a pessoa aceitar pagar? Fechar uma partida? Economizar tempo? Sentir segurança? Conseguir voltar?</p></div><div class="card reveal"><h3>02 • Forma de cobrança</h3><p>Comparar assinatura, taxa por uso, comissão por evento/reserva e pagamento por experiência. A preferência pode mudar conforme modalidade e frequência.</p></div><div class="card reveal"><h3>03 • Resistência real</h3><p>Entender por que alguém escolheria WhatsApp, clube ou grupo existente. “Não pagaria” também é evidência e ajuda a definir quem não é nosso mercado.</p></div></div></div><div style="margin-top:56px"><div class="ey" style="color:#087e72">Value capture map</div><h2 style="font-size:34px">Quatro motores possíveis de receita</h2><div class="grid g4"><div class="card kpi"><b style="font-size:28px">Free → +</b><span class="muted">Comunidade<br>Praticante → Joyn+</span></div><div class="card kpi"><b style="font-size:28px">5–10%</b><span class="muted">Operação<br>Organizador → transação</span></div><div class="card kpi"><b style="font-size:28px">B2B</b><span class="muted">Infraestrutura<br>Espaços → assinatura + reserva</span></div><div class="card kpi"><b style="font-size:28px">Comissão</b><span class="muted">Ecossistema<br>Marketplace → transação</span></div></div></div><div class="card" style="margin-top:28px;border-color:#a7d8d1"><div class="ey" style="color:#087e72">Pergunta para levar às entrevistas</div><h3 style="font-size:24px;margin-bottom:8px">“Em qual momento a Joyn teria criado valor suficiente para você aceitar pagar?”</h3><p class="muted">A resposta aberta ajuda a revelar o verdadeiro objeto de valor antes de fixarmos preço, plano ou modelo de negócio.</p></div></div></section>`;if(strategy){strategy.querySelector('.ey').textContent='05 • Product strategy';strategy.insertAdjacentHTML('beforebegin',pricing)}const s=d.createElement('script');s.textContent=`setTimeout(()=>{document.querySelectorAll('#monetizacao .reveal').forEach(e=>{if(window.IntersectionObserver){const o=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting)x.target.classList.add('on')}),{threshold:.08});o.observe(e)}else e.classList.add('on')})},100)`;d.body.appendChild(s);document.open();document.write('<!doctype html>'+d.documentElement.outerHTML);document.close()}).catch(()=>location.href='joyn_grupo6_v3.html');</script></body></html>
